<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Mesora Blocks</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #fff; color: #18181b; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #17171a; color: #ececef; } p { color: #9b9ba4; } }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 18px 0 6px; }
    p { color: #6b6b73; margin: 0 0 22px; max-width: 320px; }
    button { font: inherit; font-weight: 600; color: #fff; background: #f26522; border: 0; border-radius: 12px; padding: 12px 22px; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Mesora Blocks needs an internet connection to talk to its agents. Your projects are safe on the server.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
